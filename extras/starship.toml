add_newline = true
command_timeout = 200
format = "[EVA·01](bold purple) [│](bright-black) $directory$git_branch$git_status$character"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[directory]
style = "bold purple"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[$branch]($style) "
style = "green"

[git_status]
format = '[$all_status$ahead_behind]($style) '
style = "yellow"
